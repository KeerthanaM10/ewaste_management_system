      // --- from components/StatusDropdown.tsx ---
      const StatusDropdown = ({ currentStatus, onStatusChange, statuses }) => {
        const [isOpen, setIsOpen] = React.useState(false);
        const dropdownRef = React.useRef(null);
        React.useEffect(() => {
          const handleClickOutside = (event) => {
            if (dropdownRef.current && !dropdownRef.current.contains(event.target)) {
              setIsOpen(false);
            }
          };
          document.addEventListener('mousedown', handleClickOutside);
          return () => document.removeEventListener('mousedown', handleClickOutside);
        }, []);
        const handleSelect = (status) => {
          onStatusChange(status);
          setIsOpen(false);
        };
        return (
          <div className="relative inline-block text-left w-full" ref={dropdownRef}>
            <div>
              <button type="button" onClick={() => setIsOpen(!isOpen)} className="inline-flex justify-between items-center w-full rounded-md border border-slate-300 shadow-sm px-4 py-2 bg-white text-sm font-medium text-slate-700 hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-primary">
                {currentStatus}
                <ChevronDownIcon className="-mr-1 ml-2 h-5 w-5 text-slate-400" />
              </button>
            </div>

                <div className="py-1" role="menu">
                  <span className="block px-4 py-2 text-xs text-slate-400">All Statuses</span>
                  {statuses.map((status) => (
                    <a href="#" key={status} onClick={(e) => { e.preventDefault(); handleSelect(status); }} className={`flex justify-between items-center px-4 py-2 text-sm ${ status === currentStatus ? 'font-bold text-brand-primary' : 'text-slate-700' } hover:bg-slate-100 hover:text-slate-900`} role="menuitem">
                      <span>{status}</span>
                      {status === currentStatus && <CheckIcon className="w-5 h-5 text-brand-primary" />}
                    </a>
                  ))}
                </div>
              </div>
            )}
          </div>
        );
      };

      // --- from components/ImageInput.tsx ---
      const ImageInput = ({ onImageSelect, isProcessing }) => {
        const [showCamera, setShowCamera] = React.useState(false);
        const videoRef = React.useRef(null);
        const canvasRef = React.useRef(null);
        const fileInputRef = React.useRef(null);

        const startCamera = React.useCallback(async () => {
          try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            if (videoRef.current) {
              videoRef.current.srcObject = stream;
            }
            setShowCamera(true);
          } catch (err) {
            console.error("Error accessing camera:", err);
            alert("Could not access the camera. Please ensure permissions are granted.");
          }
        }, []);

        const stopCamera = React.useCallback(() => {
          if (videoRef.current && videoRef.current.srcObject) {
            const stream = videoRef.current.srcObject;
            stream.getTracks().forEach(track => track.stop());
            videoRef.current.srcObject = null;
          }
          setShowCamera(false);
        }, []);

        const handleCapture = () => {
          if (videoRef.current && canvasRef.current) {
            const video = videoRef.current;
            const canvas = canvasRef.current;
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const context = canvas.getContext('2d');
            if (context) {
              context.drawImage(video, 0, 0, canvas.width, canvas.height);
              const dataUrl = canvas.toDataURL('image/jpeg');
              onImageSelect(dataUrl);
              stopCamera();
            }
          }
        };

        const handleFileChange = (event) => {
          const file = event.target.files?.[0];
          if (file) {
            const reader = new FileReader();
            reader.onload = (e) => {
              if (e.target?.result) {
                onImageSelect(e.target.result);
              }
            };
            reader.readAsDataURL(file);
          }
        };

        const handleUploadClick = () => {
          fileInputRef.current?.click();
        };

        return (
          <div className="w-full max-w-lg mx-auto bg-base-100 rounded-lg shadow-lg p-6 animate-fade-in border border-base-300">
            <h2 className="text-xl font-bold text-center mb-4 text-base-content">Submit E-Waste for Analysis</h2>
            {showCamera ? (
              <div className="flex flex-col items-center">

            <div className="border-t border-base-200 pt-4"><label className="block text-xs font-medium text-slate-500 mb-1">Update Status:</label><StatusDropdown currentStatus={item.status} statuses={ITEM_STATUSES} onStatusChange={(newStatus) => onUpdateStatus(newStatus)} /></div>
          </div>
        </div>
      );
      const TrackItems = ({ history, onRegisterNew, onUpdateStatus }) => {
        const [searchTerm, setSearchTerm] = React.useState('');
        const [statusFilter, setStatusFilter] = React.useState('All');
        const [categoryFilter, setCategoryFilter] = React.useState('All');
        const filteredHistory = React.useMemo(() => {
          return history.filter(item => {
              const searchMatch = item.classification.item.toLowerCase().includes(searchTerm.toLowerCase()) || item.description.toLowerCase().includes(searchTerm.toLowerCase());
              const statusMatch = statusFilter === 'All' || item.status === statusFilter;
              const categoryMatch = categoryFilter === 'All' || item.classification.item === categoryFilter;
              return searchMatch && statusMatch && categoryMatch;
            }).sort((a, b) => new Date(b.registered_at).getTime() - new Date(a.registered_at).getTime());
        }, [history, searchTerm, statusFilter, categoryFilter]);
        const clearFilters = () => { setSearchTerm(''); setStatusFilter('All'); setCategoryFilter('All'); };
        const categories = ['All', ...Array.from(new Set(MOCK_EWASTE_CATEGORIES.map(c => c.item)))];
        return (
          <div className="w-full max-w-7xl mx-auto animate-fade-in">
            <div className="flex flex-wrap justify-between items-center gap-4 mb-6"><div><h2 className="text-3xl font-bold text-slate-800 flex items-center"><SearchIcon className="w-8 h-8 mr-3 text-brand-primary"/> Track E-Waste Items</h2><p className="text-slate-500 mt-1">Monitor the status and progress of your registered electronic waste items</p></div></div>
            <div className="bg-base-100 p-5 rounded-lg shadow-md mb-8 border border-base-300">
              <h3 className="text-lg font-bold mb-4 flex items-center text-slate-800"><FilterIcon className="w-5 h-5 mr-2"/> Filters</h3>
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                <div><label htmlFor="search" className="block text-sm font-medium text-slate-600 mb-1">Search</label><input type="text" id="search" value={searchTerm} onChange={e => setSearchTerm(e.target.value)} placeholder="Search items..." className="w-full bg-white border-base-300 rounded-md shadow-sm focus:ring-brand-primary focus:border-brand-primary"/></div>
                <div><label htmlFor="status" className="block text-sm font-medium text-slate-600 mb-1">Status</label><select id="status" value={statusFilter} onChange={e => setStatusFilter(e.target.value)} className="w-full bg-white border-base-300 rounded-md shadow-sm focus:ring-brand-primary focus:border-brand-primary"><option value="All">All Statuses</option>{ITEM_STATUSES.map(s => <option key={s} value={s}>{s}</option>)}</select></div>
                 <div><label htmlFor="category" className="block text-sm font-medium text-slate-600 mb-1">Category</label><select id="category" value={categoryFilter} onChange={e => setCategoryFilter(e.target.value)} className="w-full bg-white border-base-300 rounded-md shadow-sm focus:ring-brand-primary focus:border-brand-primary">{categories.map(c => <option key={c} value={c}>{c}</option>)}</select></div>
                <div className="self-end"><button onClick={clearFilters} className="w-full h-[42px] bg-slate-600 hover:bg-slate-700 text-white font-bold py-2 px-4 rounded-md transition-colors text-sm">Clear Filters</button></div>
              </div>
            </div>
             <div className="flex justify-between items-center mb-4"><h3 className="text-xl font-bold text-slate-800">Your E-Waste Items</h3><button onClick={onRegisterNew} className="flex items-center bg-brand-primary hover:bg-brand-secondary text-white font-bold py-2 px-4 rounded-lg transition-colors"><PlusIcon className="w-5 h-5 mr-2" />Register New Item</button></div>
            <p className="text-sm text-slate-500 mb-6">Showing {filteredHistory.length} of {history.length} items</p>
            {filteredHistory.length > 0 ? (<div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">{filteredHistory.map(item => <ItemCard key={item.id} item={item} onUpdateStatus={(newStatus) => onUpdateStatus(item.id, newStatus)} />)}</div>) : (<div className="text-center bg-base-100 rounded-lg p-12 border border-base-300"><h3 className="text-xl font-bold text-slate-800">No Items Found</h3><p className="text-slate-500 mt-2">Try adjusting your filters or register a new item.</p></div>)}
          </div>
        );
      };
      
      // --- from App.tsx ---
      const analyzeImage = (imageDataUrl) => {
          return new Promise((resolve) => {
              const img = new Image();
              img.onload = () => {
                  const canvas = document.createElement('canvas'); const maxSize = 100;
                  let width = img.width; let height = img.height;
                  if (width > height) { if (width > maxSize) { height *= maxSize / width; width = maxSize; } } else { if (height > maxSize) { width *= maxSize / height; height = maxSize; } }
                  canvas.width = width; canvas.height = height;
                  const ctx = canvas.getContext('2d');
                  if (!ctx) { resolve({ seed: imageDataUrl.length, dominantColor: 'other', avgR: 0, avgG: 0, avgB: 0, brightness: 0 }); return; }
                  ctx.drawImage(img, 0, 0, width, height);
                  try {
                      const imageData = ctx.getImageData(0, 0, width, height); const data = imageData.data;
                      let r = 0, g = 0, b = 0;
                      for (let i = 0; i < data.length; i += 4) { r += data[i]; g += data[i + 1]; b += data[i + 2]; }
                      const pixelCount = data.length / 4; const avgR = r / pixelCount; const avgG = g / pixelCount; const avgB = b / pixelCount; const brightness = (avgR + avgG + avgB) / 3;
                      let dominantColor = 'other';
                      if (brightness < 40) { dominantColor = 'black'; } else if (brightness > 200 && Math.abs(avgR - avgG) < 20 && Math.abs(avgG - avgB) < 20) { dominantColor = 'silver'; } else if (avgG > avgR * 1.1 && avgG > avgB * 1.1) { dominantColor = 'green'; } else if (avgB > avgR * 1.1 && avgB > avgG * 1.1) { dominantColor = 'blue'; } else if (Math.abs(avgR - avgG) < 20 && Math.abs(avgG - avgB) < 20) { dominantColor = 'grey'; }
                      const seed = Math.round(avgR) | (Math.round(avgG) << 8) | (Math.round(avgB) << 16);
                      resolve({ seed, dominantColor, avgR, avgG, avgB, brightness });
                  } catch (e) { console.error("Could not get image data for analysis:", e); resolve({ seed: imageDataUrl.length, dominantColor: 'other', avgR: 0, avgG: 0, avgB: 0, brightness: 0 }); }
              };
              img.onerror = () => { resolve({ seed: imageDataUrl.length, dominantColor: 'other', avgR: 0, avgG: 0, avgB: 0, brightness: 0 }); };
              img.src = imageDataUrl;
          });
      };
      const generateMockResult = (analysis) => {
          let randomSeed = analysis.seed;
          const pseudoRandom = () => { randomSeed = (randomSeed * 1664525 + 1013904223) % 4294967296; return randomSeed / 4294967296; };
          let determinedItem = null;
          if (analysis.dominantColor === 'green' && analysis.brightness > 60 && analysis.brightness < 180) { determinedItem = 'Circuit Board'; } else if (analysis.dominantColor === 'black' && analysis.avgB > (analysis.avgR + analysis.avgG) / 2 + 10) { determinedItem = 'CRT Monitor'; } else if (analysis.dominantColor === 'silver' || (analysis.dominantColor === 'grey' && analysis.brightness > 120)) { determinedItem = 'Laptop'; } else if (analysis.dominantColor === 'black' || (analysis.dominantColor === 'grey' && analysis.brightness < 120)) { determinedItem = 'Smartphone'; }
          let category = determinedItem ? MOCK_EWASTE_CATEGORIES.find(c => c.item === determinedItem) || MOCK_EWASTE_CATEGORIES[0] : MOCK_EWASTE_CATEGORIES[Math.floor(pseudoRandom() * MOCK_EWASTE_CATEGORIES.length)];
          const condition = MOCK_CONDITIONS[Math.floor(pseudoRandom() * MOCK_CONDITIONS.length)];
          const baseMaterialValue = category.valuable.reduce((sum, material) => sum + (MOCK_MATERIAL_VALUES[material] || 5), 0);
          const calculatedRecyclingValue = baseMaterialValue * (category.avg_weight_kg / 2) * (0.7 + pseudoRandom() * 0.6);
          const isRare = pseudoRandom() < 0.1; const rarityMultiplier = isRare ? 2 + pseudoRandom() * 3 : 1;
          let conditionMultiplier = 1.0; if (condition === 'Damaged') conditionMultiplier = 0.4; if (condition === 'Non-functional') conditionMultiplier = 0.1;
          const baseResaleValue = category.avg_resale_inr * (0.8 + pseudoRandom() * 0.4) * conditionMultiplier;
          const finalResaleValue = baseResaleValue * rarityMultiplier;
          const descriptions = { 'Smartphone': `Smartphone Model X${Math.floor(pseudoRandom() * 10)}`, 'Laptop': `Ultrabook Pro ${Math.floor(pseudoRandom() * 5) + 15}"`, 'CRT Monitor': `Vintage CRT Display ${Math.floor(pseudoRandom() * 20) + 14}"`, 'Tablet': `Tablet Gen ${Math.floor(pseudoRandom() * 8)}`, 'Desktop Computer': `Gaming PC Tower v${(pseudoRandom() + 1).toFixed(1)}`, 'Printer': `All-in-One Printer Series ${Math.floor(pseudoRandom() * 5000)}`, 'Circuit Board': `Motherboard Rev ${pseudoRandom().toFixed(2)}` };
          let description = descriptions[category.item] || 'Generic Item'; if (isRare && condition !== 'Non-functional') { description = `(Rare Collector's Edition) ${description}`; }
          return { id: `res_${Date.now()}_${pseudoRandom().toString(36).substr(2, 9)}`, classification: { item: category.item, confidence: pseudoRandom() * (0.95 - 0.88) + 0.88, }, description: description, materialAnalysis: { valuable: category.valuable, hazardous: category.hazardous, }, condition: condition, valueEstimation: { original: parseFloat((category.avg_original_inr * (0.8 + pseudoRandom() * 0.4)).toFixed(0)), resale: parseFloat(finalResaleValue.toFixed(0)), recycling: parseFloat(calculatedRecyclingValue.toFixed(0)), }, boundingBox: { top: 10 + pseudoRandom() * 15, left: 10 + pseudoRandom() * 15, width: 50 + pseudoRandom() * 25, height: 50 + pseudoRandom() * 25, }, status: 'Registered', weight_kg: parseFloat((category.avg_weight_kg * (0.8 + pseudoRandom() * 0.4)).toFixed(2)), carbon_saved_kg: parseFloat((category.avg_carbon_saved_kg * (0.8 + pseudoRandom() * 0.4)).toFixed(2)), registered_at: new Date().toISOString(), };
      };
      const App = () => {
          const [view, setView] = React.useState('collections');
          const [history, setHistory] = React.useState([]);
          const [image, setImage] = React.useState(null);
          const [isProcessing, setIsProcessing] = React.useState(false);
          const [processingStep, setProcessingStep] = React.useState(0);
          const [result, setResult] = React.useState(null);
          React.useEffect(() => {
              try {
                  const storedHistory = localStorage.getItem('ewasteHistory');
                  if (storedHistory) {
                      const parsedHistory = JSON.parse(storedHistory);
                      const upgradedHistory = parsedHistory.map(item => {
                          if (typeof item.status === 'undefined' || typeof item.valueEstimation.original === 'undefined') {
                              const category = MOCK_EWASTE_CATEGORIES.find(c => c.item === item.classification.item) || MOCK_EWASTE_CATEGORIES[0];
                              const descriptions = { 'Laptop': 'Dell Inspiron 15', 'Smartphone': 'Samsung Galaxy S10', 'CRT Monitor': 'Sony Trinitron' };
                              const currentResale = item.valueEstimation?.resale || category.avg_resale_inr;
                              const currentRecycling = item.valueEstimation?.recycling || category.avg_recycling_inr;
                              const originalCost = item.valueEstimation?.original || (category.avg_original_inr * (0.8 + Math.random() * 0.4));
                              return { ...item, description: item.description || descriptions[category.item] || 'Legacy Item', status: item.status || ITEM_STATUSES[Math.floor(Math.random() * 3)], valueEstimation: { resale: currentResale, recycling: currentRecycling, original: originalCost, }, weight_kg: item.weight_kg || parseFloat((category.avg_weight_kg * (0.8 + Math.random() * 0.4)).toFixed(2)), carbon_saved_kg: item.carbon_saved_kg || parseFloat((category.avg_carbon_saved_kg * (0.8 + Math.random() * 0.4)).toFixed(2)), registered_at: item.registered_at || new Date(Date.now() - Math.random() * 30 * 24 * 60 * 60 * 1000).toISOString(), };
                          }
                          return item;
                      });
                      setHistory(upgradedHistory);
                  }
              } catch (error) { console.error("Failed to parse history from localStorage", error); }
          }, []);
          React.useEffect(() => {
              let interval;
              if (isProcessing && image) {
                  interval = setInterval(() => {
                      setProcessingStep(prev => {
                          if (prev < PROCESSING_STEPS.length - 1) { return prev + 1; }
                          clearInterval(interval);
                          const finalizeProcessing = async () => { const analysis = await analyzeImage(image); setResult(generateMockResult(analysis)); setIsProcessing(false); };
                          finalizeProcessing();
                          return prev;
                      });
                  }, 750);
              }
              return () => clearInterval(interval);
          }, [isProcessing, image]);
          const startRegistrationFlow = () => { setImage(null); setResult(null); setIsProcessing(false); setProcessingStep(0); setView('register'); }
          const handleImageSelect = (imageDataUrl) => { setImage(imageDataUrl); setResult(null); setProcessingStep(0); setIsProcessing(true); };
          const handleDiscardAndReset = () => { startRegistrationFlow(); };
          const handleRegister = () => {
              if (!result) return;
              const updatedHistory = [...history, result]; setHistory(updatedHistory);
              try { localStorage.setItem('ewasteHistory', JSON.stringify(updatedHistory)); } catch (error) { console.error("Could not save to localStorage", error); setHistory(history); }
              setView('track');
          };
          const handleUpdateStatus = (itemId, newStatus) => {
              const updatedHistory = history.map(item => { if (item.id === itemId) { return { ...item, status: newStatus }; } return item; });
              setHistory(updatedHistory);
              try { localStorage.setItem('ewasteHistory', JSON.stringify(updatedHistory)); } catch (error) { console.error("Could not save to localStorage", error); setHistory(history.filter(i => i.id !== itemId)); }
          };
          const handleClearHistory = () => { if (window.confirm("Are you sure you want to delete all your registered items? This action cannot be undone.")) { setHistory([]); localStorage.removeItem('ewasteHistory'); } }
          const NAV_LINKS = [
            { id: 'dashboard', label: 'Dashboard', icon: ChartBarIcon }, { id: 'track', label: 'Track Items', icon: SearchIcon },
            { id: 'collections', label: 'Collections', icon: CollectionIcon }, { id: 'centers', label: 'Recycling Centers', icon: MapPinIcon },
            { id: 'reports', label: 'Reports', icon: DocumentReportIcon },
          ];
          const renderContent = () => {
              if (view === 'register') {
                  if (result && image) return <ResultsDisplay image={image} result={result} onRegister={handleRegister} onDiscard={handleDiscardAndReset} />;
                  if (isProcessing || (image && !result)) return <ProcessingSimulator currentStep={processingStep} />;
                  return <ImageInput onImageSelect={handleImageSelect} isProcessing={isProcessing} />;
              }
              switch (view) {
                  case 'track': return <TrackItems history={history} onRegisterNew={startRegistrationFlow} onUpdateStatus={handleUpdateStatus} />;
                  case 'dashboard': return <Reports history={history} />;
                  case 'reports': return <Reports history={history} />;
                  case 'centers': return <RecyclingCenters />;
                  case 'collections': return <Collections />;
                  case 'profile': return <Profile history={history} onClear={handleClearHistory} onExport={() => exportToCSV(history)} />;
                  default: return <TrackItems history={history} onRegisterNew={startRegistrationFlow} onUpdateStatus={handleUpdateStatus} />;
              }
          };
          return (
              <div className="min-h-screen bg-base-200 text-base-content font-sans">
                  <header className="bg-base-100/90 backdrop-blur-sm shadow-md sticky top-0 z-20 border-b border-base-300">
                      <div className="container mx-auto px-4">
                        <div className="flex justify-between items-center py-3">
                            <div className="flex items-center space-x-8">
                                <div className="flex items-center"><CpuChipIcon className="w-8 h-8 text-brand-primary"/><h1 className="text-xl font-bold ml-2 tracking-tight text-slate-800">E-Waste Manager</h1></div>
                                <nav className="hidden md:flex items-center space-x-2">{NAV_LINKS.map(link => (<button key={link.id} onClick={() => setView(link.id)} className={`flex items-center space-x-2 px-3 py-2 text-sm font-medium rounded-md transition-colors ${view === link.id ? 'bg-emerald-50 text-brand-primary' : 'text-slate-500 hover:bg-slate-100 hover:text-slate-800'}`}><link.icon className="w-5 h-5" /><span>{link.label}</span></button>))}</nav>
                            </div>
                            <div className="flex items-center space-x-3">
                                <button onClick={startRegistrationFlow} className="hidden sm:flex items-center bg-brand-primary hover:bg-brand-secondary text-white font-bold py-2 px-3 rounded-md transition-colors text-sm"><PlusIcon className="w-5 h-5 mr-1" />Register E-Waste</button>
                                <button onClick={() => setView('profile')} className={`p-2 rounded-full transition-colors ${view === 'profile' ? 'bg-emerald-50 text-brand-primary' : 'text-slate-500 hover:bg-slate-100 hover:text-slate-800'}`}><UserIcon className="w-6 h-6"/></button>
                            </div>
                        </div>
                      </div>
                  </header>
                  <main className="py-10 px-4"><div className="container mx-auto">{renderContent()}</div></main>
              </div>
          );
      };
      
      // --- from index.tsx (entry point) ---
      const rootElement = document.getElementById('root');
      if (!rootElement) {
        throw new Error("Could not find root element to mount to");
      }
      const root = ReactDOM.createRoot(rootElement);
      root.render(
        <React.StrictMode>
          <App />
        </React.StrictMode>
      );
    </script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
